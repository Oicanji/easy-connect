[project]
name = "easy-connect"
version = "1.0.1"
description = "Acesso automatizado e seguro a VMs por SSH, com cofre local, regras e integracoes LLM"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "cryptography>=43",
    "argon2-cffi>=23",
    "keyring>=25",
    "pydantic>=2",
]

[project.scripts]
easy-connect = "easy_connect.app:main"
easy-connect-cli = "easy_connect.cli:main"
easy-connect-askpass = "easy_connect.cli:askpass_main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
easy_connect = ["resources/*"]

[tool.setuptools.packages.find]
where = ["src"]
